<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page | AsmrProng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* ── Container ── */
        .container {
            background-color: #fff;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
            width: 768px;
            max-width: 100%;
            min-height: 480px;
        }

        .container p {
            font-size: 14px;
            line-height: 20px;
            letter-spacing: 0.3px;
            margin: 20px 0;
        }

        .container span {
            font-size: 12px;
            color: #666;
        }

        .container a {
            color: #333;
            font-size: 13px;
            text-decoration: none;
            margin: 15px 0 10px;
            transition: color 0.2s;
        }

        .container a:hover { color: #512da8; }

        /* ── Buttons ── */
        .container button {
            background-color: #512da8;
            color: #fff;
            font-size: 12px;
            padding: 10px 45px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .container button:hover { background-color: #4527a0; }
        .container button:active { transform: scale(0.98); }

        .container button.hidden {
            background-color: transparent;
            border-color: #fff;
        }

        .container button.hidden:hover {
            background-color: rgba(255,255,255,0.15);
        }

        /* ── Forms ── */
        .container form {
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            height: 100%;
        }

        .container form h1 {
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }

        /* ── Inputs ── */
        .container input {
            background-color: #eee;
            border: none;
            margin: 8px 0;
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            transition: background 0.2s;
        }

        .container input:focus { background-color: #e0e0fb; }

        /* ── Social icons ── */
        .social-icons {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        .icons {
            border: 1px solid #ccc;
            border-radius: 20%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            color: #333;
            text-decoration: none;
            transition: border-color 0.2s, color 0.2s, background 0.2s;
        }

        .icons:hover {
            border-color: #512da8;
            color: #512da8;
            background: #f0eeff;
        }

        /* ── Form panel positioning ── */
        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        /* Sign In — starts visible on left */
        .sign-in {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.active .sign-in {
            transform: translateX(100%);
        }

        /* Sign Up — starts hidden underneath */
        .sign-up {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.active .sign-up {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: move 0.6s;
        }

        @keyframes move {
            0%,  49.99% { opacity: 0; z-index: 1; }
            50%, 100%   { opacity: 1; z-index: 5; }
        }

        /* ── Toggle overlay ── */
        .toggle-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            border-radius: 150px 0 0 100px;
            z-index: 1000;
        }

        .container.active .toggle-container {
            transform: translateX(-100%);
            border-radius: 0 150px 100px 0;
        }

        /*
         * FIX: .toggle must be 200% wide so both panels sit side by side.
         * left: -100% shows the RIGHT half by default (the "Sign Up" prompt).
         * Original had left: -100 (missing px) and used `transform` twice
         * (second one silently overwrote the first).
         */
        .toggle {
            background: linear-gradient(to right, #5c6bc0, #512da8);
            color: #fff;
            position: relative;
            width: 200%;
            height: 100%;
            left: -100%;
            transition: all 0.6s ease-in-out;
        }

        .container.active .toggle {
            transform: translateX(50%);
        }

        /*
         * FIX: panels must be 50% of the (200%-wide) .toggle = 25% viewport,
         * which equals 50% of the visible toggle-container — correct.
         * Original had width:50px, height:100px — tiny fixed sizes.
         */
        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            text-align: center;
            transition: all 0.6s ease-in-out;
        }

        .toggle-panel h1 { font-weight: 700; margin-bottom: 8px; }

        /* Left panel hidden off-screen initially */
        .toggle-left {
            left: 0;
            transform: translateX(-200%);
        }

        .container.active .toggle-left {
            transform: translateX(0);
        }

        /* Right panel visible by default */
        .toggle-right {
            right: 0;
            transform: translateX(0);
        }

        .container.active .toggle-right {
            transform: translateX(200%);
        }
    </style>
</head>
<body>

<div class="container" id="container">

    <!-- ── Sign Up Form ── -->
    <div class="form-container sign-up">
        <form>
            <h1>Create Account</h1>
            <div class="social-icons">
                <a href="#" class="icons" title="Google"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#" class="icons" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icons" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icons" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text"     placeholder="Name">
            <input type="email"    placeholder="Email">
            <input type="password" placeholder="Password">
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <!-- ── Sign In Form ── -->
    <div class="form-container sign-in">
        <form>
            <h1>Sign In</h1>
            <div class="social-icons">
                <a href="#" class="icons" title="Google"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#" class="icons" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="icons" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="#" class="icons" title="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            </div>
            <span>or use your email &amp; password</span>
            <input type="email"    placeholder="Email">
            <input type="password" placeholder="Password">
            <a href="#">Forgot your password?</a>
            <button type="submit">Sign In</button>
        </form>
    </div>

    <!-- ── Sliding Toggle Overlay ── -->
    <div class="toggle-container">
        <div class="toggle">

            <!-- Shown when Sign Up panel is active -->
            <div class="toggle-panel toggle-left">
                <h1>Welcome Back!</h1>
                <p>Enter your personal details to use all site features.</p>
                <button class="hidden" id="login">Sign In</button>
            </div>

            <!-- Shown by default (Sign In side) -->
            <div class="toggle-panel toggle-right">
                <h1>Hello, Friend!</h1>
                <p>Register your personal details to use all site features.</p>
                <button class="hidden" id="register">Sign Up</button>
            </div>

        </div>
    </div>

</div>

<script>
    const container  = document.getElementById('container');
    const registerBtn = document.getElementById('register');
    const loginBtn    = document.getElementById('login');

    registerBtn.addEventListener('click', () => container.classList.add('active'));
    loginBtn.addEventListener('click',    () => container.classList.remove('active'));
</script>

</body>
</html>
